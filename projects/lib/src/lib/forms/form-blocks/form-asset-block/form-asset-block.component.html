<div class="form-asset-block-header">
    @if(formBlock.label) {
    <span class="title">{{formBlock.label}}</span>
    }
    <div>
        <button mat-button color="accent" [disabled]="!assetsForm" matTooltip="Importer un asset"
            (click)="openAssetImporter()">
            <mat-icon>file_upload</mat-icon>Importer
        </button>
        <button mat-button color="primary" [disabled]="!assetsForm" (click)="openMediaPicker()">
            <mat-icon class="me-2">edit</mat-icon>Modifier
        </button>
        <button mat-button color="warn" ngReallyTitle="Confirmation require"
            ngReallyMessage="Voulez-vous vraiement supprimer l'association avec ce media ?" (ngReallyClick)="onClear()"
            [disabled]="!formBlock.value">
            <mat-icon class="me-2">link_off</mat-icon>Dissocier
        </button>
    </div>
</div>
<div class="image-wrapper">
    @if(formBlock.value?.id) {
    <ce-media-factory class="m-2" [elt]="formBlock.value!" (delete)="delete(formBlock.value!)">
    </ce-media-factory>
    } @else {
    <div class="no-image" style="min-height:256px">
        <h4 class="text-muted">Aucune Donnée</h4>
    </div>
    }
</div>
