<ce-form-block-field [label]="formBlock.label ?? 'NO LABEL'" headerAppearance="bordered">            

    <ce-form-block-field-actions *ngIf="!formBlock.readonly">
        <button mat-stroked-button color="primary" [disabled]="status | isActionPendingOrRunning" (click)="startAction()"><mat-icon>play_arrow</mat-icon>Démarrer</button>                
        <button mat-stroked-button color="primary" [disabled]="!(status | isActionPendingOrRunning)" (click)="cancelAction()"><mat-icon>cancel</mat-icon>Annuler</button>
    </ce-form-block-field-actions>    

    <ce-form-block-field-content>
        <mat-progress-bar mode="determinate" *ngIf="status | isActionPendingOrRunning"></mat-progress-bar>
        <mat-progress-bar mode="indeterminate" *ngIf="status | isActionRunning"></mat-progress-bar>
        <mat-progress-bar mode="buffer" *ngIf="status | isActionPending"></mat-progress-bar>
        <textarea [readOnly]="true" #textarea class="messages-area" [scrollTop]="textarea.scrollHeight">{{messages}}</textarea>
    </ce-form-block-field-content>

</ce-form-block-field>
